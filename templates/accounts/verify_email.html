{% extends "base.html" %}
{% block content %}
<div class="col-md-5 col-lg-4 mx-auto text-center">
  <h1 class="h4 fw-bold mb-2">Check your inbox</h1>
  <p class="text-muted small">We've sent a 6-digit verification code to <strong>{{ email }}</strong>.</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% if not locked %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100">Verify</button>
  </form>
  <form method="post" action="{% url 'resend_otp' %}" class="mt-2">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">
    <button type="submit" class="btn btn-link btn-sm">Resend code</button>
  </form>
  {% endif %}
</div>
{% endblock %}
