{% extends "base.html" %}
{% block content %}
<div class="col-md-5 col-lg-4 mx-auto text-center">
  <h1 class="h4 fw-bold mb-2">Enter your code</h1>
  <p class="text-muted small">If <strong>{{ email }}</strong> is registered, we've sent it a 6-digit code.</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% if not locked %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100">Continue</button>
  </form>
  {% endif %}
  <div class="mt-3"><a href="{% url 'forgot_password' %}">Didn't get a code? Start again</a></div>
</div>
{% endblock %}
