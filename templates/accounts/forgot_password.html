{% extends "base.html" %}
{% block content %}
<div class="col-md-5 col-lg-4 mx-auto">
<!-- forgot passowrd was added as Jay raised an issue, for ausing already existing module to accept the url -->
  <h1 class="h4 fw-bold mb-2">Forgot your password?</h1>
  <!--Same as 6 digit code, for signup-->
  <p class="text-muted small">Enter your UoN email and we'll send you a 6-digit code.</p>
  <form method="post">
    {% csrf_token %}
    <input type="email" name="email" class="form-control mb-3" placeholder="you@uon.edu.au" required autofocus>
    <button type="submit" class="btn btn-success w-100">Send code</button>
  </form>
  <div class="text-center mt-3"><a href="{% url 'login' %}">Back to log in</a></div>
</div>
{% endblock %}
