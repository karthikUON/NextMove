<div class="col-6 col-md-4 col-lg-3">
  <div class="card h-100 listing-card shadow-sm">
    <img src="https://picsum.photos/seed/nextmove-{{ listing.id }}/640/440" class="card-img-top" alt="{{ listing.title }}">
    <div class="card-body py-2">
      <p class="fw-semibold mb-0 text-truncate">{{ listing.title }}</p>
      <p class="text-success fw-bold mb-0">
        {% if listing.price > 0 %}${{ listing.price }}{% else %}Free / Enquire{% endif %}
      </p>
      <p class="text-muted small mb-0">{{ listing.category.name }} &middot; {{ listing.get_campus_display }}</p>
    </div>
  </div>
</div>
