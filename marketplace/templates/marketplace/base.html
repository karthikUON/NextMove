<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NextMove{% endblock %} - UoN Student Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; color: #198754 !important; }
    .listing-card img { height: 180px; object-fit: cover; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">NextMove</a>
      <div>
        <a class="nav-link d-inline px-2" href="{% url 'home' %}">Home</a>
        <a class="nav-link d-inline px-2" href="{% url 'browse' %}">Browse</a>
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top bg-white py-3 mt-auto">
    <div class="container text-muted small">
      NextMove &copy; 2026 &mdash; UoN Student Marketplace
    </div>
  </footer>
</body>
</html>
